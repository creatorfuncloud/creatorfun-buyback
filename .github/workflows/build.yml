name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the verifiable-build job below may write, to attach release files to v* tags.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup toolchain install 1.84.1 --profile minimal && rustup default 1.84.1

      - name: Unit tests (run rules)
        run: cargo test --locked --manifest-path programs/creatorfun-buyback/Cargo.toml

      - name: Solana CLI 2.1.21
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Anchor CLI 0.31.1
        run: cargo install --git https://github.com/solana-foundation/anchor --tag v0.31.1 anchor-cli --locked

      - name: Build devnet test version
        run: |
          anchor build -- --features devnet
          cp target/deploy/creatorfun_buyback.so creatorfun_buyback_devnet.so

      - name: Build program (mainnet)
        run: anchor build

      - name: Program hash
        run: |
          mv creatorfun_buyback_devnet.so target/deploy/
          sha256sum target/deploy/creatorfun_buyback.so | tee target/deploy/creatorfun_buyback.so.sha256
          sha256sum target/deploy/creatorfun_buyback_devnet.so
          ls -l target/deploy/*.so

      - uses: actions/upload-artifact@v4
        with:
          name: creatorfun-buyback
          path: |
            target/deploy/creatorfun_buyback.so
            target/deploy/creatorfun_buyback.so.sha256
            target/deploy/creatorfun_buyback_devnet.so
            target/idl/creatorfun_buyback.json
            Cargo.lock

  verifiable-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: solana-verify
        run: cargo install solana-verify --locked

      - name: Verifiable build, devnet test version (Docker)
        run: |
          solana-verify build --library-name creatorfun_buyback -- --features devnet
          mkdir -p out && cp target/deploy/creatorfun_buyback.so out/creatorfun_buyback_devnet.so

      - name: Verifiable build, mainnet (Docker)
        run: |
          solana-verify build --library-name creatorfun_buyback
          cp target/deploy/creatorfun_buyback.so out/creatorfun_buyback.so
          solana-verify get-executable-hash out/creatorfun_buyback.so | tee out/creatorfun_buyback.so.hash
          solana-verify get-executable-hash out/creatorfun_buyback_devnet.so | tee out/creatorfun_buyback_devnet.so.hash
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: creatorfun-buyback-verifiable
          path: out/*

      - name: Release assets (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
